<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bloom. backend test</title>
<style>
  body{ font-family: -apple-system, sans-serif; background:#F4EEFB; color:#4B3B5C; padding:20px; }
  h1{ font-size:20px; }
  button{
    background:#FF9FC7; border:none; border-radius:10px; padding:12px 18px;
    font-size:15px; font-weight:700; color:#4B3B5C; margin:6px 6px 6px 0; cursor:pointer;
  }
  pre{
    background:#FFFDF6; border-radius:10px; padding:14px; font-size:13px;
    white-space:pre-wrap; word-break:break-word; box-shadow:0 4px 12px rgba(75,59,92,0.14);
  }
  .pass{ color:#2E9163; font-weight:700; }
  .fail{ color:#D6336C; font-weight:700; }
</style>
</head>
<body>
  <h1>🌱 bloom. backend test</h1>
  <p>Testing: <code id="url"></code></p>
  <button onclick="runAllTests()">Run all tests</button>
  <div id="results"></div>

<script>
const WORKER_URL = 'https://bloom-push.neofiveph.workers.dev';
document.getElementById('url').textContent = WORKER_URL;

function log(label, ok, detail){
  const div = document.createElement('div');
  div.innerHTML = `<p class="${ok ? 'pass' : 'fail'}">${ok ? '✅' : '❌'} ${label}</p><pre>${escapeHtml(detail)}</pre>`;
  document.getElementById('results').appendChild(div);
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function runAllTests(){
  document.getElementById('results').innerHTML = '';
  const fakeSub = {
    endpoint: 'https://fcm.googleapis.com/fake/test-endpoint-' + Date.now(),
    keys: { p256dh: 'fake-p256dh', auth: 'fake-auth' }
  };

  // Test 1: subscribe
  try{
    const res = await fetch(WORKER_URL + '/subscribe', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ subscription: fakeSub })
    });
    const data = await res.json();
    log('Subscribe', res.ok && data.ok, JSON.stringify(data) + ' (status ' + res.status + ')');
  } catch(e){
    log('Subscribe', false, 'Network/CORS error: ' + e.message);
  }

  // Test 2: schedule a reminder
  try{
    const dueAt = new Date(Date.now() + 3600000).toISOString();
    const res = await fetch(WORKER_URL + '/schedule-reminder', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        endpoint: fakeSub.endpoint, subscription: fakeSub,
        taskId: 'test-task-1', title: 'bloom. 🌱', body: 'test reminder', dueAt
      })
    });
    const data = await res.json();
    log('Schedule reminder', res.ok && data.ok, JSON.stringify(data) + ' (status ' + res.status + ')');
  } catch(e){
    log('Schedule reminder', false, 'Network/CORS error: ' + e.message);
  }

  // Test 3: cancel that reminder
  try{
    const res = await fetch(WORKER_URL + '/cancel-reminder', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ taskId: 'test-task-1' })
    });
    const data = await res.json();
    log('Cancel reminder', res.ok && data.ok, JSON.stringify(data) + ' (status ' + res.status + ')');
  } catch(e){
    log('Cancel reminder', false, 'Network/CORS error: ' + e.message);
  }

  // Test 4: unsubscribe
  try{
    const res = await fetch(WORKER_URL + '/unsubscribe', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ endpoint: fakeSub.endpoint })
    });
    const data = await res.json();
    log('Unsubscribe', res.ok && data.ok, JSON.stringify(data) + ' (status ' + res.status + ')');
  } catch(e){
    log('Unsubscribe', false, 'Network/CORS error: ' + e.message);
  }

  // Test 5: missing fields should error cleanly (400), not crash
  try{
    const res = await fetch(WORKER_URL + '/schedule-reminder', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ taskId: 'incomplete' })
    });
    const data = await res.json();
    log('Missing fields handled cleanly', res.status === 400, JSON.stringify(data) + ' (status ' + res.status + ')');
  } catch(e){
    log('Missing fields handled cleanly', false, 'Network/CORS error: ' + e.message);
  }
}
</script>
</body>
</html>
