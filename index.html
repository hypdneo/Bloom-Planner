  :root{
    --lavender: #F4EEFB;
    --lavender-deep: #E8DCF7;
    --cream: #FFFDF6;
    --plum: #4B3B5C;
    --plum-soft: #8B7A9B;
    --pink: #FF9FC7;
    --pink-soft: #FFE1EF;
    --mint: #8FDCB4;
    --mint-soft: #DDF6E8;
    --butter: #FFD873;
    --butter-soft: #FFF3D2;
    --sky: #92C6F5;
    --sky-soft: #DFEEFD;
    --shadow: rgba(75, 59, 92, 0.14);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 8px 8px, rgba(139,122,155,0.10) 1.4px, transparent 1.4px) 0 0/26px 26px,
      linear-gradient(160deg, var(--lavender) 0%, #F9F5FD 55%, var(--lavender-deep) 100%);
    font-family: 'Quicksand', sans-serif;
    color: var(--plum);
    padding: 32px 20px 80px;
  }

  .wrap{ max-width: 1180px; margin: 0 auto; }

  /* ---- Header ---- */
  .header{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:20px;
    margin-bottom:34px;
    position:relative;
  }

  .brand{ display:flex; align-items:center; gap:14px; }

  .brand svg{ width:48px; height:48px; flex-shrink:0; }

  .brand h1{
    font-family:'Baloo 2', sans-serif;
    font-size:38px;
    font-weight:800;
    margin:0;
    line-height:1;
    color: var(--plum);
    letter-spacing: -0.5px;
  }
  .brand p{
    margin:4px 0 0;
    font-size:14.5px;
    font-weight:600;
    color: var(--plum-soft);
  }

  .header-controls{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .notif-btn{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    width:38px; height:38px;
    background: var(--cream);
    border:none;
    border-radius:12px;
    color: var(--plum-soft);
    cursor:pointer;
    box-shadow: 0 4px 12px var(--shadow);
    transition: all .15s ease;
    transform: rotate(-4deg);
  }
  .notif-btn svg{ width:19px; height:19px; transition: transform .2s ease; }
  .notif-btn:hover{ transform: rotate(0deg) translateY(-1px); }
  .notif-btn.on{
    background: var(--pink-soft);
    color: var(--plum);
  }
  .notif-btn.on svg{ transform: rotate(-8deg); }
  .notif-btn .ping{
    position:absolute;
    top:6px; right:7px;
    width:7px; height:7px;
    border-radius:50%;
    background: var(--pink);
    border:1.5px solid var(--cream);
    display:none;
  }
  .notif-btn.on .ping{ display:block; }

  /* in-app reminder toast */
  .toast{
    position:fixed;
    top:18px; left:50%;
    transform: translateX(-50%) translateY(-12px) rotate(-1deg);
    background: var(--cream);
    border-radius:14px;
    padding:12px 16px 12px 14px;
    box-shadow: 0 12px 28px var(--shadow);
    display:flex; align-items:center; gap:10px;
    max-width: 320px;
    opacity:0;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 999;
    pointer-events:none;
  }
  .toast.show{
    opacity:1;
    transform: translateX(-50%) translateY(0) rotate(-1deg);
  }
  .toast .tape{
    position:absolute; top:-7px; left:50%; width:30px; height:13px; margin-left:-15px;
    background: var(--pink); opacity:.85; border-radius:2px; transform:rotate(-3deg);
  }
  .toast .txt{ font-size:13px; font-weight:700; color:var(--plum); line-height:1.35; }
  .toast .txt b{ display:block; font-family:'Baloo 2'; font-size:12px; color:var(--plum-soft); font-weight:700; margin-bottom:2px; }

  .weeknav{
    display:flex;
    align-items:center;
    gap:14px;
    background: var(--cream);
    padding:10px 16px;
    border-radius:16px;
    box-shadow: 0 6px 18px var(--shadow);
  }
  .weeknav button{
    width:34px; height:34px;
    border-radius:10px;
    border:none;
    background: var(--pink-soft);
    color: var(--plum);
    font-family:'Baloo 2';
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: transform .15s ease, background .15s ease;
  }
  .weeknav button:hover{ background: var(--pink); transform: scale(1.08); }
  .weeknav .range{
    font-family:'Baloo 2';
    font-weight:700;
    font-size:15.5px;
    min-width:150px;
    text-align:center;
  }

  /* ---- Legend ---- */
  .legend{
    display:flex;
    gap:18px;
    flex-wrap:wrap;
    margin-bottom:22px;
  }
  .legend .chip{
    display:flex; align-items:center; gap:7px;
    font-size:13px; font-weight:600; color: var(--plum-soft);
  }
  .legend .dot{
    width:11px; height:11px; border-radius:4px;
    transform: rotate(-8deg);
  }

  /* ---- Board ---- */
  .board{
    display:grid;
    grid-template-columns: repeat(7, 1fr);
    gap:16px;
  }
  @media (max-width: 980px){
    .board{ grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); }
  }

  .day{
    background: var(--cream);
    border-radius: 20px;
    padding: 16px 14px 18px;
    min-height: 340px;
    box-shadow: 0 8px 22px var(--shadow);
    position: relative;
    transform: rotate(var(--tilt, 0deg));
    transition: transform .25s ease, box-shadow .25s ease;
    display:flex;
    flex-direction:column;
  }
  .day:hover{ transform: rotate(0deg) translateY(-3px); box-shadow: 0 14px 30px var(--shadow); }

  .day.today{
    transform: rotate(0deg);
    outline: 2.5px solid var(--mint);
    outline-offset: 3px;
    box-shadow: 0 0 0 6px var(--mint-soft), 0 10px 26px var(--shadow);
  }

  .day-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:12px;
    padding-bottom:10px;
    border-bottom: 2px dashed var(--lavender-deep);
  }
  .day-head .dname{
    font-family:'Baloo 2'; font-weight:700; font-size:16px;
  }
  .day-head .dnum{
    font-size:12.5px; font-weight:600; color: var(--plum-soft);
  }
  .today .day-head .dname{ color:#2E9163; }

  .tasks{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
    margin-bottom:10px;
  }

  .task{
    position:relative;
    background: var(--cat-soft, var(--sky-soft));
    border-radius: 10px;
    padding: 9px 10px 9px 12px;
    font-size: 13px;
    font-weight: 600;
    line-height:1.35;
    cursor:pointer;
    transform: rotate(var(--wob, 0deg));
    transition: transform .15s ease, opacity .15s ease;
    word-break: break-word;
  }
  .task:hover{ transform: rotate(0deg) scale(1.02); }

  .task .tape{
    position:absolute;
    top:-8px; left:50%;
    width:34px; height:14px;
    margin-left:-17px;
    background: var(--cat, var(--sky));
    opacity:0.85;
    border-radius:2px;
    transform: rotate(-3deg);
    box-shadow: 0 2px 3px rgba(0,0,0,0.08);
  }

  .task .txt{ display:block; }
  .task.done .txt{ text-decoration: line-through; opacity:0.55; }

  .task .time{
    display:block;
    font-size:10.5px;
    font-weight:700;
    color: var(--plum-soft);
    margin-top:3px;
  }

  .add-btn{
    border: 2px dashed var(--lavender-deep);
    background: transparent;
    color: var(--plum-soft);
    border-radius: 10px;
    padding: 8px 0;
    font-family:'Quicksand';
    font-weight:700;
    font-size: 13px;
    cursor:pointer;
    transition: all .15s ease;
  }
  .add-btn:hover{
    border-color: var(--pink);
    color: var(--plum);
    background: var(--pink-soft);
  }

  /* ---- Add form ---- */
  .add-form{
    display:none;
    flex-direction:column;
    gap:8px;
    background: var(--lavender);
    border-radius: 12px;
    padding: 10px;
    margin-top: 2px;
  }
  .add-form.open{ display:flex; }
  .add-form input[type=text]{
    border:none;
    border-radius:8px;
    padding:7px 9px;
    font-family:'Quicksand';
    font-weight:600;
    font-size:12.5px;
    outline:none;
  }
  .add-form input[type=time]{
    border:none;
    border-radius:8px;
    padding:6px 8px;
    font-family:'Quicksand';
    font-weight:600;
    font-size:12px;
    outline:none;
  }
  .cat-picker{ display:flex; gap:6px; }
  .cat-picker button{
    width:22px; height:22px;
    border-radius:7px;
    border:2px solid transparent;
    cursor:pointer;
  }
  .cat-picker button.sel{ border-color: var(--plum); }
  .add-form .row{ display:flex; gap:6px; }
  .add-form .row button.save{
    flex:1;
    background: var(--plum);
    color: var(--cream);
    border:none;
    border-radius:8px;
    font-family:'Baloo 2';
    font-weight:600;
    font-size:12.5px;
    padding:6px 0;
    cursor:pointer;
  }
  .add-form .row button.cancel{
    background: transparent;
    color: var(--plum-soft);
    border:none;
    font-weight:700;
    font-size:12px;
    cursor:pointer;
  }

  footer{
    text-align:center;
    margin-top:40px;
    font-size:12.5px;
    color: var(--plum-soft);
    font-weight:600;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="header">
    <div class="brand">
      <svg viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="30" fill="#FFD873" opacity="0.35"/>
        <path d="M32 44c-8 0-14-6-14-13 0-5 3-8 7-11 2 6 3 9 7 9s5-3 7-9c4 3 7 6 7 11 0 7-6 13-14 13z" fill="#8FDCB4"/>
        <path d="M32 44V20" stroke="#4B3B5C" stroke-width="2.4" stroke-linecap="round"/>
        <circle cx="32" cy="17" r="5" fill="#FF9FC7"/>
      </svg>
      <div>
        <h1>bloom.</h1>
        <p>your cozy weekly planner 🌱</p>
      </div>
    </div>

    <div class="header-controls">
      <div class="weeknav">
        <button id="prevWeek">‹</button>
        <span class="range" id="weekRange">—</span>
        <button id="nextWeek">›</button>
      </div>
      <button id="notifToggle" class="notif-btn" aria-label="Toggle reminders" title="Reminders">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 3.5c-3 0-5.2 2.3-5.2 5.7v2.6c0 .9-.35 1.75-1.1 2.4L4.5 15.3h15l-1.2-1.1c-.75-.65-1.1-1.5-1.1-2.4V9.2C17.2 5.8 15 3.5 12 3.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"/>
          <path d="M9.7 18.2c.3 1 1.1 1.6 2.3 1.6s2-.6 2.3-1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <span class="ping"></span>
      </button>
    </div>
  </div>

  <div class="legend">
    <div class="chip"><span class="dot" style="background:var(--sky)"></span>class</div>
    <div class="chip"><span class="dot" style="background:var(--butter)"></span>homework</div>
    <div class="chip"><span class="dot" style="background:var(--pink)"></span>deadline</div>
    <div class="chip"><span class="dot" style="background:var(--mint)"></span>self-care</div>
  </div>

  <div class="board" id="board"></div>

  <footer>made with 🌸 in bloom — click a task to check it off, click again to remove</footer>
</div>

<script>
const CATS = {
  class:    { color:'#92C6F5', soft:'#DFEEFD' },
  homework: { color:'#FFD873', soft:'#FFF3D2' },
  deadline: { color:'#FF9FC7', soft:'#FFE1EF' },
  selfcare: { color:'#8FDCB4', soft:'#DDF6E8' },
};

const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const TILTS = [-1.4, 1.1, -0.8, 1.6, -1.2, 0.9, -1.6];

let weekOffset = 0;
const STORAGE_KEY = 'bloom_tasks_v1';
const NOTIF_KEY = 'bloom_notifs_enabled';

// tasks[dateKey] = [{id, text, time, cat, done}]
let tasks = loadTasks();
let notifsEnabled = localStorage.getItem(NOTIF_KEY) === 'true';
const scheduledTimers = {};

function loadTasks(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch(e){
    console.error('Could not load saved tasks', e);
    return {};
  }
}

function saveTasks(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  } catch(e){
    console.error('Could not save tasks', e);
  }
}

function startOfWeek(offset){
  const now = new Date();
  const day = now.getDay(); // 0 = Sun
  const monday = new Date(now);
  monday.setHours(0,0,0,0);
  const diffToMonday = (day === 0 ? -6 : 1 - day);
  monday.setDate(now.getDate() + diffToMonday + offset*7);
  return monday;
}

function dateKey(d){
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function fmtRange(monday){
  const sunday = new Date(monday);
  sunday.setDate(monday.getDate()+6);
  const opts = { month:'short', day:'numeric' };
  return `${monday.toLocaleDateString('en-US', opts)} – ${sunday.toLocaleDateString('en-US', opts)}`;
}

function render(){
  const monday = startOfWeek(weekOffset);
  document.getElementById('weekRange').textContent = fmtRange(monday);

  const board = document.getElementById('board');
  board.innerHTML = '';

  const today = new Date(); today.setHours(0,0,0,0);

  for(let i=0;i<7;i++){
    const d = new Date(monday);
    d.setDate(monday.getDate()+i);
    const key = dateKey(d);
    const isToday = d.getTime() === today.getTime();

    const dayEl = document.createElement('div');
    dayEl.className = 'day' + (isToday ? ' today' : '');
    dayEl.style.setProperty('--tilt', TILTS[i]+'deg');

    const dow = DAY_NAMES[d.getDay()];

    dayEl.innerHTML = `
      <div class="day-head">
        <span class="dname">${dow}</span>
        <span class="dnum">${d.getMonth()+1}/${d.getDate()}</span>
      </div>
      <div class="tasks" id="tasks-${key}"></div>
      <button class="add-btn" data-key="${key}">+ add task</button>
      <div class="add-form" id="form-${key}">
        <input type="text" placeholder="what's the task?" maxlength="60" id="input-${key}">
        <div class="row">
          <input type="time" id="time-${key}" style="flex:1">
        </div>
        <div class="cat-picker" id="picker-${key}"></div>
        <div class="row">
          <button class="save" data-key="${key}">save</button>
          <button class="cancel" data-key="${key}">cancel</button>
        </div>
      </div>
    `;
    board.appendChild(dayEl);

    // category picker
    const picker = dayEl.querySelector(`#picker-${key}`);
    let selectedCat = 'class';
    Object.entries(CATS).forEach(([name, c], idx)=>{
      const b = document.createElement('button');
      b.style.background = c.color;
      if(idx===0) b.classList.add('sel');
      b.addEventListener('click', ()=>{
        picker.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
        b.classList.add('sel');
        selectedCat = name;
      });
      picker.appendChild(b);
    });

    // render existing tasks
    renderTasks(key);

    // add button toggles form
    dayEl.querySelector('.add-btn').addEventListener('click', ()=>{
      document.getElementById(`form-${key}`).classList.add('open');
    });
    dayEl.querySelector('.cancel').addEventListener('click', ()=>{
      document.getElementById(`input-${key}`).value = '';
      document.getElementById(`time-${key}`).value = '';
      document.getElementById(`form-${key}`).classList.remove('open');
    });
    dayEl.querySelector('.save').addEventListener('click', ()=>{
      const input = document.getElementById(`input-${key}`);
      const timeInput = document.getElementById(`time-${key}`);
      const text = input.value.trim();
      if(!text) return;
      if(!tasks[key]) tasks[key] = [];
      const newTask = {
        id: Date.now()+Math.random(),
        text,
        time: timeInput.value,
        cat: selectedCat,
        done: false
      };
      tasks[key].push(newTask);
      saveTasks();
      scheduleReminder(key, newTask);
      input.value = '';
      timeInput.value = '';
      document.getElementById(`form-${key}`).classList.remove('open');
      renderTasks(key);
    });
  }
}

function renderTasks(key){
  const container = document.getElementById(`tasks-${key}`);
  if(!container) return;
  container.innerHTML = '';
  const list = tasks[key] || [];
  list.forEach((t, idx)=>{
    const c = CATS[t.cat] || CATS.class;
    const wob = (idx % 2 === 0 ? -1 : 1) * (1 + (idx%3));
    const el = document.createElement('div');
    el.className = 'task' + (t.done ? ' done' : '');
    el.style.setProperty('--cat', c.color);
    el.style.setProperty('--cat-soft', c.soft);
    el.style.setProperty('--wob', wob+'deg');
    el.innerHTML = `
      <span class="tape"></span>
      <span class="txt">${escapeHtml(t.text)}</span>
      ${t.time ? `<span class="time">${formatTime(t.time)}</span>` : ''}
    `;
    el.addEventListener('click', ()=>{
      if(!t.done){
        t.done = true;
        clearReminder(t.id);
        saveTasks();
        renderTasks(key);
      } else {
        tasks[key] = tasks[key].filter(x=>x.id!==t.id);
        clearReminder(t.id);
        saveTasks();
        renderTasks(key);
      }
    });
    container.appendChild(el);
  });
}

function formatTime(t){
  const [h,m] = t.split(':').map(Number);
  const ampm = h>=12 ? 'pm':'am';
  const h12 = ((h+11)%12)+1;
  return `${h12}:${String(m).padStart(2,'0')}${ampm}`;
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('prevWeek').addEventListener('click', ()=>{ weekOffset--; render(); });
document.getElementById('nextWeek').addEventListener('click', ()=>{ weekOffset++; render(); });

/* ---- Reminders (local notifications) ----
   Note: these only fire while bloom is open in a browser tab or the
   home-screen app is running/foregrounded. There's no server behind this,
   so it can't wake up and notify you if bloom is fully closed —
   that would need a paid push service. */

const hasNotifAPI = ('Notification' in window);

function showToast(title, body){
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span class="tape"></span><span class="txt"><b>${title}</b>${escapeHtml(body)}</span>`;
  document.body.appendChild(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 300);
  }, 5000);
}

function updateNotifButton(){
  const btn = document.getElementById('notifToggle');
  if(notifsEnabled){
    btn.classList.add('on');
    btn.title = 'Reminders on';
  } else {
    btn.classList.remove('on');
    btn.title = 'Reminders off';
  }
}

function scheduleReminder(key, task){
  if(!notifsEnabled || !task.time) return;

  const [h, m] = task.time.split(':').map(Number);
  const target = new Date(key + 'T00:00:00');
  target.setHours(h, m, 0, 0);

  const delay = target.getTime() - Date.now();
  // Only schedule if it's in the future and within ~20 days (setTimeout limits)
  if(delay <= 0 || delay > 20*24*60*60*1000) return;

  const timerId = setTimeout(()=>{
    // Always show an in-app reminder — works on every platform, including iPad
    showToast('⏰ reminder', task.text);
    // Bonus: also fire a real OS notification where the browser supports it
    if(hasNotifAPI && Notification.permission === 'granted'){
      try{ new Notification('bloom. 🌱', { body: task.text, tag: String(task.id) }); }
      catch(e){ /* ignore */ }
    }
    delete scheduledTimers[task.id];
  }, delay);

  scheduledTimers[task.id] = timerId;
}

function clearReminder(taskId){
  if(scheduledTimers[taskId]){
    clearTimeout(scheduledTimers[taskId]);
    delete scheduledTimers[taskId];
  }
}

function rescheduleAllReminders(){
  Object.keys(scheduledTimers).forEach(id => clearTimeout(scheduledTimers[id]));
  Object.keys(scheduledTimers).forEach(id => delete scheduledTimers[id]);
  if(!notifsEnabled) return;
  Object.entries(tasks).forEach(([key, list])=>{
    list.forEach(t => { if(!t.done) scheduleReminder(key, t); });
  });
}

document.getElementById('notifToggle').addEventListener('click', async ()=>{
  if(!notifsEnabled){
    notifsEnabled = true;
    localStorage.setItem(NOTIF_KEY, 'true');
    if(hasNotifAPI){
      try{ await Notification.requestPermission(); } catch(e){ /* ignore */ }
    }
    rescheduleAllReminders();
    showToast('🔔 reminders on', hasNotifAPI ? "you'll get notified when tasks are due" : "you'll see a banner here when tasks are due, while bloom is open");
  } else {
    notifsEnabled = false;
    localStorage.setItem(NOTIF_KEY, 'false');
    rescheduleAllReminders(); // clears all since notifsEnabled is now false
  }
  updateNotifButton();
});

updateNotifButton();
if(notifsEnabled){
  rescheduleAllReminders();
}

render();

// Register service worker for full PWA support (offline caching, installability)
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{ /* ignore, app still works without it */ });
  });
}
</script>
</body>
</html>
